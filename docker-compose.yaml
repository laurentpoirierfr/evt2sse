services:
  db:
    image: postgres:17-alpine
    container_name: evt2sse-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: evt2sse-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGURL: postgres://postgres:postgres@db:5432/postgres?sslmode=disable
    ports:
      - "8080:8080"
    command: ["./evt2sse", "-db", "postgres://postgres:postgres@db:5432/postgres?sslmode=disable", "-addr", ":8080"]
