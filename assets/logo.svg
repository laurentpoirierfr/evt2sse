<svg xmlns="http://www.w3.org/2000/svg" width="640" height="200" viewBox="0 0 640 200" role="img" aria-labelledby="title desc">
  <title id="title">evt2sse — Notifications PostgreSQL NOTIFY/LISTEN vers SSE</title>
  <desc id="desc">Logo evt2sse : base de données PostgreSQL reliée par une flèche à un badge SSE, wordmark "evt2sse" orange et description du projet.</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#04070D"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141E33"/>
      <stop offset="1" stop-color="#0C1426"/>
    </linearGradient>
    <linearGradient id="dbGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12203A"/>
      <stop offset="1" stop-color="#0E1830"/>
    </linearGradient>
    <radialGradient id="glowCyan">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowOrange">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="dbClip">
      <path d="M36 66 v30 a30 10 0 0 0 60 0 v-30 Z"/>
    </clipPath>
  </defs>

  <!-- Fond sombre moderne -->
  <rect x="0" y="0" width="640" height="200" rx="32" fill="url(#bgGrad)"/>
  <circle cx="70" cy="30" r="190" fill="url(#glowCyan)"/>
  <circle cx="575" cy="205" r="220" fill="url(#glowOrange)"/>

  <!-- Badge -->
  <g filter="url(#shadow)">
    <rect x="18" y="20" width="164" height="160" rx="36" fill="url(#badgeGrad)" stroke="#2A3A5C" stroke-width="2"/>
  </g>

  <!-- Base PostgreSQL (NOTIFY/LISTEN) -->
  <ellipse cx="66" cy="96" rx="30" ry="10" fill="#1F2A44"/>
  <path d="M36 66 v30 a30 10 0 0 0 60 0 v-30 Z" fill="url(#dbGrad)" stroke="#24324F" stroke-width="1"/>
  <g clip-path="url(#dbClip)">
    <path d="M42 73 H90" stroke="#2C3E62" stroke-width="2" stroke-linecap="round"/>
    <path d="M42 80 H90" stroke="#2C3E62" stroke-width="2" stroke-linecap="round"/>
    <path d="M42 87 H90" stroke="#2C3E62" stroke-width="2" stroke-linecap="round"/>
  </g>
  <ellipse cx="66" cy="66" rx="30" ry="10" fill="#38BDF8"/>

  <!-- Flèche de relais -->
  <path d="M106 81 H126" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
  <path d="M132 81 L116 72 L116 90 Z" fill="#38BDF8"/>

  <!-- Badge SSE (façade Server-Sent Events) -->
  <rect x="142" y="63" width="54" height="36" rx="18" fill="#0E2940" stroke="#38BDF8" stroke-width="2"/>
  <text x="169" y="88" font-family="Verdana, Arial, sans-serif" font-size="17" font-weight="700" fill="#38BDF8" text-anchor="middle" letter-spacing="1">SSE</text>

  <!-- État / IHM de suivi (coin supérieur droit) -->
  <circle cx="158" cy="42" r="8" fill="#34D399"/>
  <circle cx="158" cy="42" r="3" fill="#0B1220"/>

  <!-- Wordmark (accent orange) -->
  <text x="220" y="86" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="58" font-weight="800" letter-spacing="0.5">
    <tspan fill="#F1F5F9">evt</tspan><tspan fill="#94A3B8">2</tspan><tspan fill="#F59E0B">sse</tspan>
  </text>

  <!-- Sous-titre -->
  <circle cx="226" cy="114" r="4" fill="#34D399"/>
  <text x="240" y="120" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#94A3B8" letter-spacing="0.4">Relais de notifications PostgreSQL → SSE</text>

  <text x="240" y="146" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#71809A" letter-spacing="0.4">IHM de suivi embarquée · client Go · chart Helm</text>
</svg>